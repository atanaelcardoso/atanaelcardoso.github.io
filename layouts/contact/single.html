<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com Atanael Cardoso sobre seu projeto ou serviço.">
    <title>{{ .Title }}</title>
    {{ $style := resources.Get "css/style.css" | minify }}
    <link rel="stylesheet" href="{{ $style.Permalink }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ "/" | relURL }}" class="logo logo-link">atanaelcardoso<span>.</span></a>
    </nav>

    <main>
        <section class="section-wrapper contact-section" aria-labelledby="contact-title">
            <div class="container-inner contact-container">
                <p class="contact-eyebrow">Contato</p>
                <h1 class="contact-title" id="contact-title">Vamos conversar</h1>
                <p class="contact-intro">Conte um pouco sobre o seu projeto ou serviço. Vou responder pelo seu e-mail.</p>
                <p class="contact-required">Os campos marcados com * são obrigatórios.</p>

                <form class="contact-form" id="contact-form">
                    <div class="contact-field">
                        <label for="contact-name">Nome <span aria-hidden="true">*</span></label>
                        <input id="contact-name" name="name" type="text" autocomplete="name" required>
                    </div>
                    <div class="contact-field">
                        <label for="contact-email">E-mail <span aria-hidden="true">*</span></label>
                        <input id="contact-email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="contact-field">
                        <label for="contact-company">Empresa <span class="optional">(opcional)</span></label>
                        <input id="contact-company" name="company" type="text" autocomplete="organization">
                    </div>
                    <div class="contact-field">
                        <label for="contact-message">Mensagem <span aria-hidden="true">*</span></label>
                        <textarea id="contact-message" name="message" rows="6" required></textarea>
                    </div>
                    <button class="btn-pill contact-submit" type="submit">Enviar mensagem</button>
                    <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
                </form>
                <a href="{{ "/" | relURL }}" class="btn-pill btn-pill-outline contact-back">Voltar ao portfólio</a>
            </div>
        </section>
    </main>

    {{ partial "footer.html" . }}

    <script>
        document.querySelector("#contact-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const form = event.currentTarget;
            const status = document.querySelector("#contact-status");
            const submitButton = form.querySelector('button[type="submit"]');
            const formData = new FormData(form);
            formData.set("_subject", `Contato pelo portfólio: ${formData.get("name").trim()}`);
            formData.set("_replyto", formData.get("email").trim());

            status.className = "contact-status is-pending";
            status.textContent = "Enviando mensagem...";
            submitButton.disabled = true;

            try {
                const response = await fetch("https://formsubmit.co/ajax/atanaelcardoso3@gmail.com", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(Object.fromEntries(formData))
                });
                const responseText = await response.text();
                let result;

                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(`O serviço respondeu de forma inesperada (HTTP ${response.status}).`);
                }

                if (!response.ok || (result.success !== "true" && result.success !== true)) {
                    throw new Error(result.message || `O serviço recusou o envio (HTTP ${response.status}).`);
                }

                form.reset();
                status.className = "contact-status is-success";
                status.textContent = "Mensagem enviada. Obrigado! Responderei em breve.";
            } catch (error) {
                console.error("Erro ao enviar a mensagem de contato:", error);
                status.className = "contact-status is-error";
                const reason = error instanceof Error ? error.message : "Ocorreu um erro inesperado.";
                status.textContent = `Não foi possível enviar a mensagem: ${reason} Se este for o primeiro envio, procure no seu e-mail (inclusive no spam) a mensagem de ativação do FormSubmit e confirme o endereço. Depois, tente novamente. Você também pode escrever para atanaelcardoso3@gmail.com.`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
