<script>
    const menuButton = document.querySelector(".menu-toggle");
    const navigation = document.querySelector("#primary-navigation");

    const closeMenu = () => {
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", menuButton.dataset.openLabel);
        navigation.classList.remove("is-open");
    };

    menuButton.addEventListener("click", () => {
        const isExpanded = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-expanded", String(!isExpanded));
        menuButton.setAttribute("aria-label", isExpanded ? menuButton.dataset.openLabel : menuButton.dataset.closeLabel);
        navigation.classList.toggle("is-open", !isExpanded);
    });

    navigation.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenu();
    });

    const themeButton = document.querySelector("[data-theme-toggle]");
    const themeColor = document.querySelector('meta[name="theme-color"]');

    const updateThemeLabel = () => {
        const nextThemeLabel = document.documentElement.dataset.theme === "light"
            ? themeButton.dataset.darkLabel
            : themeButton.dataset.lightLabel;
        themeButton.setAttribute("aria-label", nextThemeLabel);
        themeButton.title = nextThemeLabel;
        themeButton.setAttribute("aria-pressed", String(document.documentElement.dataset.theme === "light"));
        themeColor.content = document.documentElement.dataset.theme === "light" ? "#F5F7FA" : "#080D18";
    };

    updateThemeLabel();
    themeButton.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        try {
            localStorage.setItem("portfolio-theme", nextTheme);
        } catch (error) {
            console.error("Could not save the theme preference:", error);
        }
        updateThemeLabel();
    });

    const projectGrid = document.querySelector("[data-project-grid]");
    const projectToggle = document.querySelector("[data-projects-toggle]");

    if (projectGrid && projectToggle) {
        const projectCards = [...projectGrid.querySelectorAll(".project-card")];
        const initialCount = Number(projectGrid.dataset.initialCount);
        const batchSize = Number(projectGrid.dataset.batchSize);
        const projectToggleLabel = projectToggle.querySelector("[data-projects-toggle-label]");
        const projectCount = projectToggle.querySelector("[data-projects-remaining]");
        let visibleCount = Math.min(initialCount, projectCards.length);

        const updateProjects = () => {
            const isExpanded = visibleCount > initialCount;
            const isFullyExpanded = visibleCount === projectCards.length;

            projectCards.forEach((card, index) => {
                card.hidden = index >= visibleCount;
            });

            projectToggle.hidden = projectCards.length <= initialCount;
            projectToggle.setAttribute("aria-expanded", String(isExpanded));
            projectToggleLabel.textContent = isFullyExpanded
                ? projectToggle.dataset.lessLabel
                : projectToggle.dataset.moreLabel;
            projectCount.textContent = isFullyExpanded ? "" : `(${projectCards.length - visibleCount})`;
        };

        updateProjects();
        projectToggle.addEventListener("click", () => {
            visibleCount = visibleCount === projectCards.length
                ? initialCount
                : Math.min(visibleCount + batchSize, projectCards.length);
            updateProjects();
        });
    }

    const sectionLinks = [...document.querySelectorAll("[data-section-link]")];
    const sections = sectionLinks
        .map((link) => document.querySelector(new URL(link.href, window.location.href).hash))
        .filter(Boolean);
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const progressBar = document.querySelector("[data-scroll-progress]");
    let progressFrame = 0;

    const updateScrollProgress = () => {
        if (!progressBar || progressFrame) return;
        progressFrame = window.requestAnimationFrame(() => {
            const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = scrollableHeight > 0
                ? Math.min(100, Math.max(0, (window.scrollY / scrollableHeight) * 100))
                : 0;
            progressBar.style.setProperty("--scroll-progress", `${progress}%`);
            progressBar.setAttribute("aria-valuenow", String(Math.round(progress)));
            progressFrame = 0;
        });
    };

    updateScrollProgress();
    window.addEventListener("scroll", updateScrollProgress, { passive: true });
    window.addEventListener("resize", updateScrollProgress);

    const projectVisuals = [...document.querySelectorAll(".project-visual")];
    let projectScanFrame = 0;

    const updateProjectScans = () => {
        if (reducedMotion || projectScanFrame || projectVisuals.length === 0) return;

        projectScanFrame = window.requestAnimationFrame(() => {
            const viewportHeight = window.innerHeight;
            const scanStart = viewportHeight * 0.88;
            const scanEnd = viewportHeight * 0.12;

            projectVisuals.forEach((visual) => {
                const bounds = visual.getBoundingClientRect();
                const progress = Math.min(1, Math.max(0,
                    (scanStart - bounds.top) / (bounds.height + scanStart - scanEnd)
                ));
                const isScanning = bounds.bottom > scanEnd && bounds.top < scanStart;

                visual.style.setProperty("--scan-position", `${progress * 100}%`);
                visual.style.setProperty("--scan-opacity", isScanning ? "1" : "0");

                visual.querySelectorAll(
                    ".cinema-layout > *, .community-layout > *, .task-layout > *, .document-flow > *"
                ).forEach((item) => {
                    const itemBounds = item.getBoundingClientRect();
                    const itemProgress = (itemBounds.top + itemBounds.height / 2 - bounds.top) / bounds.height;
                    item.classList.toggle("is-scan-reached", isScanning && progress >= itemProgress);
                });
            });

            projectScanFrame = 0;
        });
    };

    updateProjectScans();
    window.addEventListener("scroll", updateProjectScans, { passive: true });
    window.addEventListener("resize", updateProjectScans);
    projectToggle?.addEventListener("click", updateProjectScans);

    const typewriter = document.querySelector("[data-typewriter]");

    if (typewriter && !reducedMotion) {
        const phrases = [
            typewriter.textContent.trim(),
            ...[...document.querySelectorAll("[data-typing-phrase]")].map((phrase) => phrase.textContent.trim())
        ];
        let phraseIndex = 0;
        let characterIndex = phrases[0].length;
        let deleting = true;

        const typeNextCharacter = () => {
            if (document.hidden) {
                window.setTimeout(typeNextCharacter, 600);
                return;
            }

            const phrase = phrases[phraseIndex];

            if (deleting) {
                characterIndex -= 1;
                typewriter.textContent = phrase.slice(0, characterIndex);
                if (characterIndex === 0) {
                    deleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    window.setTimeout(typeNextCharacter, 280);
                    return;
                }
            } else {
                const nextPhrase = phrases[phraseIndex];
                characterIndex += 1;
                typewriter.textContent = nextPhrase.slice(0, characterIndex);
                if (characterIndex === nextPhrase.length) {
                    deleting = true;
                    window.setTimeout(typeNextCharacter, 1900);
                    return;
                }
            }

            window.setTimeout(typeNextCharacter, deleting ? 38 : 62);
        };

        window.setTimeout(typeNextCharacter, 1500);
    }

    if (!reducedMotion && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        document.querySelectorAll(".project-card").forEach((card) => {
            card.addEventListener("pointermove", (event) => {
                const bounds = card.getBoundingClientRect();
                const x = (event.clientX - bounds.left) / bounds.width;
                const y = (event.clientY - bounds.top) / bounds.height;
                card.style.setProperty("--pointer-x", `${x * 100}%`);
                card.style.setProperty("--pointer-y", `${y * 100}%`);
                card.style.setProperty("--tilt-x", `${(0.5 - y) * 2.4}deg`);
                card.style.setProperty("--tilt-y", `${(x - 0.5) * 2.4}deg`);
            });

            card.addEventListener("pointerleave", () => {
                card.style.removeProperty("--pointer-x");
                card.style.removeProperty("--pointer-y");
                card.style.removeProperty("--tilt-x");
                card.style.removeProperty("--tilt-y");
            });
        });
    }

    if ("IntersectionObserver" in window) {
        if (reducedMotion) {
            document.querySelectorAll("[data-reveal]").forEach((element) => element.classList.add("is-visible"));
        } else {
            document.querySelectorAll("[data-stagger-items]").forEach((group) => {
                [...group.children].forEach((child, index) => {
                    child.style.setProperty("--stagger-index", String(Math.min(index, 7)));
                });
            });

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add("is-visible");
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: "0px 0px -48px 0px", threshold: 0.08 });

            document.querySelectorAll("[data-reveal]").forEach((element) => {
                element.classList.add("reveal-pending");
                revealObserver.observe(element);
            });
        }

        const sectionObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                sectionLinks.forEach((link) => {
                    const isCurrent = new URL(link.href, window.location.href).hash === `#${entry.target.id}`;
                    if (isCurrent) link.setAttribute("aria-current", "location");
                    else link.removeAttribute("aria-current");
                });
            });
        }, { rootMargin: "-30% 0px -60% 0px" });

        sections.forEach((section) => sectionObserver.observe(section));
    }
</script>
